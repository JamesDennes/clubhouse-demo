<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8">
<title>The Clubhouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-title" content="Clubhouse">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- do not cache this page -->
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Inter:wght@400;600;700&display=swap">
<style>
/* Password screen for The Clubhouse, following DESIGN.md (club black, terrace orange) */
:root{color-scheme:dark;--club:#121212;--accent:#F47B20;--accent-hover:#FF8C36;--accent-press:#DB6A12;--on-accent:#121212;--on-club:#FFFFFF;--on-club-2:#C9C2BA;--line:rgba(255,255,255,.22);--field:#201F1D;--error-ink:#FF9C92;--focus:#2F6FED;--fd:'Big Shoulders Display','Barlow Condensed','Arial Narrow',sans-serif;--fb:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--club)}
body{color:var(--on-club);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hidden{display:none!important}
.staticrypt-content{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(60% 45% at 15% 0%,rgba(244,123,32,.16),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(244,123,32,.10),transparent 70%),var(--club)}
.card{width:100%;max-width:380px;text-align:center}
.badge{width:96px;height:96px;display:block;margin:0 auto 18px;animation:spin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{from{opacity:0;transform:scale(.8) rotate(-200deg)}to{opacity:1;transform:none}}
h1{font:900 clamp(34px,9vw,44px)/1 var(--fd);text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px}
h1::after{content:"";display:block;width:46px;height:4px;border-radius:2px;background:var(--accent);margin:12px auto 0}
.lead{margin:0 0 24px;color:var(--on-club-2);font-size:16px}
form{display:flex;flex-direction:column;gap:14px;text-align:left}
label.lbl{font:700 13px var(--fb);letter-spacing:.02em}
.pw{position:relative}
.pw input{width:100%;height:52px;padding:0 56px 0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--on-club);font:400 16px var(--fb);scroll-margin:120px}
.pw input:focus{outline:3px solid var(--focus);outline-offset:2px;border-color:var(--accent)}
.pw input[aria-invalid=true]{border-color:var(--error-ink)}
.eye{position:absolute;right:4px;top:4px;width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--on-club-2);display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--on-club)}
.eye:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.eye svg{width:22px;height:22px}
.err{margin:-4px 0 0;color:var(--error-ink);font-weight:600;font-size:14px;min-height:0}
.remember{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;color:var(--on-club-2);font-size:15px}
.remember input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.remember input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.go{min-height:52px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 16px var(--fb);cursor:pointer;transition:background .15s,transform .1s}
.go:hover{background:var(--accent-hover)}
.go:active{background:var(--accent-press);transform:scale(.97)}
.go:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.go[disabled]{opacity:.6;cursor:wait}
.foot{margin:22px 0 0;color:var(--on-club-2);font-size:13px}
.staticrypt-spinner-container{min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--club)}
.staticrypt-spinner{width:2rem;height:2rem;border:.25em solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* short screens (phone landscape, or the keyboard is open): sit at the top so the box stays in view */
@media (max-height:560px){.staticrypt-content{justify-content:flex-start}.badge{width:64px;height:64px;margin-bottom:10px}h1{font-size:32px}.lead{margin-bottom:14px}}
/* phone on its side: title on the left, form on the right, so everything fits without scrolling */
@media (max-height:560px) and (orientation:landscape) and (min-width:560px){
  .staticrypt-content{justify-content:center}
  .card{max-width:720px;display:grid;grid-template-columns:1fr 1.15fr;column-gap:32px;align-items:center;text-align:left}
  .card .badge,.card h1,.card .lead,.card .foot{grid-column:1}
  .card form{grid-column:2;grid-row:1/span 4;gap:10px}
  .badge{margin:0 0 10px}
  h1::after{margin:10px 0 0}
  .lead{margin:0}
  .foot{margin-top:10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body class="staticrypt-body">
<div id="staticrypt_loading" class="staticrypt-spinner-container"><div class="staticrypt-spinner" role="status" aria-label="Loading"></div></div>

<main id="staticrypt_content" class="staticrypt-content hidden">
  <div class="card">
    <img class="badge" src="icons/icon-192.png" width="96" height="96" alt="">
    <h1>The Clubhouse</h1>
    <p class="lead">Enter the club password</p>
    <form id="staticrypt-form" action="#" method="post" novalidate>
      <label class="lbl" for="staticrypt-password">Password</label>
      <div class="pw">
        <input id="staticrypt-password" type="password" name="password" placeholder="Club password"
               autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="staticrypt-error">
        <button type="button" class="eye" id="staticrypt-toggle" aria-label="Show password" aria-pressed="false">
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eye-shut" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <p class="err" id="staticrypt-error" role="alert" aria-live="assertive"></p>
      <label id="staticrypt-remember-label" class="remember hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember">
        <span>Remember me on this device for 30 days</span>
      </label>
      <button type="submit" class="go" id="staticrypt-submit">Let me in</button>
    </form>
    <p class="foot">Anytown FC is a made-up demo club.</p>
  </div>
</main>
